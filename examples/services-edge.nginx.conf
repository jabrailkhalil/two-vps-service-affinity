# Example only: adapt certificates, limits, forwarded-IP trust and private TLS.
# 10.77.0.2 is the application VPS on an authenticated private network.
upstream application_writer {
    server 10.77.0.2:8081 max_fails=2 fail_timeout=10s;
    keepalive 8;
}
server {
    listen 127.0.0.1:8080;
    server_name app.example.com;

    location /api/ {
        proxy_pass http://application_writer/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        # Keep the single attempt for writes. Never enable non_idempotent.
        proxy_next_upstream off;
        proxy_intercept_errors on;
        error_page 502 503 504 = @recover_read;
    }
    location @recover_read {
        # A real application reserve must enforce read-only too.
        if ($request_method !~ ^(GET|HEAD)$) { return 503; }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Connection "";
        proxy_next_upstream off;
        add_header Cache-Control "private, no-store" always;
    }
}
